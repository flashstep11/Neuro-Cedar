<!-- --- Tier card: Silver → Gold progress. Same in both reward arms. --- -->
<div class="cl-tier-card" role="complementary" aria-label="Your tier status">
  <div class="cl-tier-card__badge" aria-hidden="true">🥈</div>
  <div class="cl-tier-card__info">
    <div class="cl-tier-card__name">Silver Tier</div>
    <div class="cl-tier-card__sub">72% to Gold</div>
    <div class="cl-tier-card__bar-wrap">
      <div class="cl-tier-card__bar" role="progressbar"
           aria-valuenow="72" aria-valuemin="0" aria-valuemax="100"
           style="width:72%"></div>
    </div>
  </div>
</div>
