# Render Blueprint for the Cedarline study: FREE tier, no disk.
#
# All study state (oTree data, assignment counts, pool sequence, lottery
# contacts) lives in an external Postgres whose URL you paste in as
# DATABASE_URL (see DEPLOY_FREE.md). Nothing is stored on Render's disk, which
# a free service loses on every restart.
#
# Free-tier behaviour to know about: the service sleeps after 15 idle minutes
# and takes about a minute to wake. Wake it before a session (open the URL).
services:
  - type: web
    name: cedarline-study
    runtime: python
    plan: free
    region: singapore        # closest Render region to India
    buildCommand: pip install -r requirements.txt
    startCommand: otree prodserver 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OTREE_PRODUCTION
        value: "1"
      - key: OTREE_AUTH_LEVEL
        value: STUDY
      - key: OTREE_ADMIN_PASSWORD
        sync: false          # you type this in (a strong one)
      - key: OTREE_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false          # paste your Postgres connection string
